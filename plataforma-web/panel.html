<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppRA - Panel Indoamérica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --morado-indo: #51007a; --naranja-indo: #e85a06; --fondo-gris: #f5f2f7; }
        body { background-color: var(--fondo-gris); font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        
        /* Barra de navegación - Ligeramente más alta para el logo grande */
        .navbar-indo { background-color: var(--morado-indo); border-bottom: 5px solid var(--naranja-indo); padding-top: 10px; padding-bottom: 10px; }
        
        /* LOGO MÁS GRANDE */
        .logo-nav { 
            height: 70px; /* Aumentado de 48px a 70px */
            width: auto; 
            max-width: 250px; /* Permite que se expanda horizontalmente */
            object-fit: contain; 
            margin-right: 20px; /* Un poco más de separación del texto */
            background: #ffffff; 
            border-radius: 8px; 
            padding: 6px 12px; 
        }
        
        /* Texto al lado del logo, un poco más grande para equilibrar */
        .navbar-brand { font-size: 1.4rem; }

        .card-header-indo { background-color: var(--morado-indo); color: white; font-weight: bold; border-radius: 12px 12px 0 0 !important; padding: 15px 20px; font-size: 1.1rem; }
        .btn-naranja { background-color: var(--naranja-indo); color: white; font-weight: bold; border: none; transition: 0.3s; }
        .btn-naranja:hover { background-color: #c94d03; transform: translateY(-2px); }
        
        /* Pestañas */
        .nav-tabs .nav-link { color: var(--morado-indo); font-weight: bold; border: none; padding: 12px 20px; }
        .nav-tabs .nav-link.active { background-color: var(--morado-indo) !important; color: white !important; border-radius: 8px 8px 0 0; }
        
        /* Espaciado en la tabla para que respire */
        .table-custom td, .table-custom th { padding: 15px; }
        .table-custom thead { background-color: var(--morado-indo); color: white; }
        
        .btn-outline-morado { border-color: var(--morado-indo); color: var(--morado-indo); }
        .btn-outline-morado:hover { background-color: var(--morado-indo); color: white; }

        /* Modo Oscuro */
        .dark-mode { background-color: #0f172a !important; color: white !important; }
        .dark-mode .card { background-color: #1e293b !important; color: white !important; border: 1px solid #334155; }
        .dark-mode .form-control { background-color: #0f172a !important; border-color: #334155 !important; color: white !important; }
        .dark-mode td { background-color: #1e293b !important; color: white !important; border-bottom: 1px solid #334155; }
        .dark-mode .table { color: white !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-indo mb-4 shadow">
    <div class="container-fluid px-4 px-lg-5">
        <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
            <img src="images/logo.png" alt="Logo" class="logo-nav"> Panel de Control - AppRA
        </a>
        <div class="d-flex gap-3 align-items-center">
            <button class="btn btn-dark btn-sm px-3 shadow-sm h-100" onclick="document.body.classList.toggle('dark-mode')">Modo Oscuro</button>
            <button class="btn btn-naranja btn-sm px-3 shadow-sm h-100" id="btnCerrarSesion">Cerrar Sesión</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 px-lg-5 mt-2 mb-5">
    <div class="row g-4">
        
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header card-header-indo">Configurar Ejercicio</div>
                <div class="card-body p-4 bg-white" style="border-radius: 0 0 12px 12px;">
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary text-uppercase mb-2">1. Selecciona el Tipo</label>
                        <select class="form-control form-control-lg border-2 shadow-sm" id="tipo_regresion" style="border-color: var(--morado-indo);">
                            <option value="">-- Elige una opción --</option>
                            <option value="linear">Regresión Lineal</option>
                            <option value="logistic">Regresión Logística</option>
                        </select>
                    </div>

                    <form id="ejercicioForm" class="d-none mt-2">
                        <input type="hidden" id="editId">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">ID del QR</label>
                            <input type="text" class="form-control fw-bold bg-light" id="id_enunciado" readonly>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Enunciado del Problema</label>
                            <textarea class="form-control shadow-sm" id="enunciado_completo" rows="4" required placeholder="Escribe el problema aquí..."></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Datos X (Ej: 1, 2, 3)</label>
                            <input type="text" class="form-control shadow-sm" id="datos_x" required placeholder="Valores separados por coma">
                        </div>
                        <div class="mb-5">
                            <label class="form-label small fw-bold text-secondary" id="label_datos_y">Datos Y (Ej: 10, 20, 30)</label>
                            <input type="text" class="form-control shadow-sm" id="datos_y" required placeholder="Valores separados por coma">
                        </div>
                        <button type="submit" class="btn btn-naranja w-100 py-3 shadow" id="btnGuardar" style="border-radius: 8px;">GUARDAR Y GENERAR QR</button>
                        <button type="button" class="btn btn-light border w-100 mt-3 py-2 fw-bold text-secondary" onclick="location.reload()" style="border-radius: 8px;">CANCELAR</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header card-header-indo">Base de Ejercicios</div>
                <div class="card-body p-0" style="border-radius: 0 0 12px 12px; overflow: hidden;">
                    <ul class="nav nav-tabs px-4 pt-3 bg-light" id="tabEjercicios" role="tablist">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#panelLineal">Lineales</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#panelLogistico">Logísticas</button></li>
                    </ul>
                    <div class="tab-content table-responsive p-3">
                        <div class="tab-pane fade show active" id="panelLineal">
                            <table class="table table-hover align-middle mb-0 table-custom">
                                <thead class="table-dark"><tr><th style="border-radius: 8px 0 0 8px;">ID</th><th>Enunciado</th><th>Datos (X/Y)</th><th style="border-radius: 0 8px 8px 0;">Acciones</th></tr></thead>
                                <tbody id="tablaLinealBody"></tbody>
                            </table>
                        </div>
                        <div class="tab-pane fade" id="panelLogistico">
                            <table class="table table-hover align-middle mb-0 table-custom">
                                <thead class="table-dark"><tr><th style="border-radius: 8px 0 0 8px;">ID</th><th>Enunciado</th><th>Datos (X/Y)</th><th style="border-radius: 0 8px 8px 0;">Acciones</th></tr></thead>
                                <tbody id="tablaLogisticaBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { firebaseConfig } from "./config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let listaEjer = [];

    // Cerrar sesión
    document.getElementById('btnCerrarSesion').addEventListener('click', () => {
        Swal.fire({
            title: '¿Cerrar sesión?',
            text: "Tendrás que volver a ingresar tus credenciales.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e85a06',
            cancelButtonColor: '#51007a',
            confirmButtonText: 'Sí, salir',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                signOut(auth).then(() => {
                    window.location.href = "index.html"; 
                }).catch((error) => {
                    Swal.fire("Error", "No se pudo cerrar la sesión", "error");
                });
            }
        });
    });

    // Secuencia
    function calcularSecuencia(tipo) {
        const prefijo = tipo === 'logistic' ? 'ejercicio0' : 'ejercicio';
        const nums = listaEjer
            .filter(e => e.id && e.id.startsWith(prefijo))
            .map(e => parseInt(e.id.replace(prefijo, '')) || 0);
        
        const max = nums.length > 0 ? Math.max(...nums) : 0;
        return prefijo + (max + 1);
    }

    // Selector
    document.getElementById('tipo_regresion').addEventListener('change', (e) => {
        const tipo = e.target.value;
        const form = document.getElementById('ejercicioForm');
        const labelY = document.getElementById('label_datos_y');
        
        if (!tipo) {
            form.classList.add('d-none');
            form.reset();
            return;
        }

        form.classList.remove('d-none');
        
        if(tipo === 'logistic') {
            labelY.innerHTML = "Datos Y <span class='text-danger fw-bold'>(Ej: 0, 1, 0, 1 - Solo Ceros y Unos)</span>";
        } else {
            labelY.innerHTML = "Datos Y <span class='text-primary fw-bold'>(Ej: 10, 20, 30)</span>";
        }
        
        form.reset();
        document.getElementById('id_enunciado').value = calcularSecuencia(tipo);
        document.getElementById('editId').value = "";
    });

    // Cargar datos
    onSnapshot(collection(db, "ejercicios"), (snap) => {
        listaEjer = snap.docs.map(d => ({id: d.id, ...d.data()}));
        
        const bodyL = document.getElementById('tablaLinealBody');
        const bodyLog = document.getElementById('tablaLogisticaBody');
        bodyL.innerHTML = "";
        bodyLog.innerHTML = "";

        listaEjer.forEach(d => {
            const row = `<tr>
                <td><span class="badge bg-secondary px-3 py-2 fs-6 rounded-pill">${d.id}</span></td>
                <td class="text-secondary">${d.enunciado_completo || ''}</td>
                <td>
                    <div class="bg-light p-2 rounded border shadow-sm">
                        <span class="text-primary fw-bold">X:</span> <small>${Array.isArray(d.datos_variable_x) ? d.datos_variable_x.join(', ') : d.datos_variable_x}</small><br>
                        <span class="text-danger fw-bold">Y:</span> <small>${Array.isArray(d.datos_variable_y) ? d.datos_variable_y.join(', ') : d.datos_variable_y}</small>
                    </div>
                </td>
                <td>
                    <div class="d-flex flex-column gap-2">
                        <div class="btn-group w-100">
                            <button class="btn btn-outline-morado btn-sm fw-bold" onclick="editarEjer('${d.id}')">Editar</button>
                            <button class="btn btn-outline-danger btn-sm fw-bold" onclick="borrarEjer('${d.id}')">Borrar</button>
                        </div>
                        <button class="btn btn-dark btn-sm fw-bold shadow-sm" onclick="generarQR('${d.id}')">Mostrar QR</button>
                    </div>
                </td>
            </tr>`;
            
            if (d.tipo === 'logistic') {
            // Si es logístico, va a la tabla logística
            bodyLog.innerHTML += row;
        } else if (d.tipo === 'linear') {
            // Si es lineal, va a la tabla lineal
            bodyL.innerHTML += row;
        } 
        // Si no es ninguno de los dos, simplemente lo ignoramos para que no se mezcle.
        });
    });

    // Guardar
    document.getElementById('ejercicioForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('id_enunciado').value;
        const tipo = document.getElementById('tipo_regresion').value;
        
        const arrayX = document.getElementById('datos_x').value.split(',').map(s => Number(s.trim()));
        const arrayY = document.getElementById('datos_y').value.split(',').map(s => Number(s.trim()));
        
        await setDoc(doc(db, "ejercicios", id), {
            id: id,
            tipo: tipo,
            enunciado_completo: document.getElementById('enunciado_completo').value,
            datos_variable_x: arrayX,
            datos_variable_y: arrayY
        });
        
        Swal.fire("Éxito", "Ejercicio guardado correctamente", "success");
        document.getElementById('ejercicioForm').reset();
        document.getElementById('ejercicioForm').classList.add('d-none');
        document.getElementById('tipo_regresion').value = "";
    });

    window.editarEjer = async (id) => {
        const docSnap = await getDoc(doc(db, "ejercicios", id));
        if (docSnap.exists()) {
            const d = docSnap.data();
            document.getElementById('editId').value = id;
            document.getElementById('id_enunciado').value = id;
            document.getElementById('tipo_regresion').value = d.tipo;
            
            const labelY = document.getElementById('label_datos_y');
            if(d.tipo === 'logistic') {
                labelY.innerHTML = "Datos Y <span class='text-danger fw-bold'>(Ej: 0, 1, 0, 1 - Solo Ceros y Unos)</span>";
            } else {
                labelY.innerHTML = "Datos Y <span class='text-primary fw-bold'>(Ej: 10, 20, 30)</span>";
            }

            document.getElementById('enunciado_completo').value = d.enunciado_completo;
            document.getElementById('datos_x').value = d.datos_variable_x.join(', ');
            document.getElementById('datos_y').value = d.datos_variable_y.join(', ');
            document.getElementById('ejercicioForm').classList.remove('d-none');
            
            // Hacer scroll suave hacia arriba para que el profe vea el formulario
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };

    window.borrarEjer = async (id) => { 
        if(confirm("¿Seguro que quieres borrar este ejercicio? Esta acción no se puede deshacer.")) {
            await deleteDoc(doc(db, "ejercicios", id)); 
        }
    };

    window.generarQR = (id) => { 
        Swal.fire({ 
            title: 'Código QR Listo',
            text: 'ID del Ejercicio: ' + id,
            html: '<div id="qr" class="d-flex justify-content-center p-3 bg-white rounded border shadow-sm mx-auto" style="width: 250px;"></div>', 
            didOpen: () => {
                new QRCode(document.getElementById('qr'), {
                    text: id,
                    width: 200,
                    height: 200,
                    colorDark : "#51007a", 
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }
        }); 
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
